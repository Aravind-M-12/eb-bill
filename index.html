<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aravind</title>

<style>
*{
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body{
    font-family: Arial, Helvetica, sans-serif;
}

.image{
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
    min-height: 100vh;
    overflow: hidden;
}

.image img{
    width: 100%;
    height: 100vh;
    object-fit: cover;
}

/* white box */
.box{
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    opacity: 0.3;
    border-radius: 15px;
    box-shadow: 2px 2px 10px white;
    background: white;
    width: 450px;
    max-width: 90%;
    height: 500px;
}

/* heading */
.heading{
    position: absolute;
    top: 80px;
    color: white;
    text-align: center;
}

.heading h1{
    font-size: 40px;
}

/* form */
.contact{
    position: absolute;
    top: 160px;
    width: 100%;
    display: flex;
    justify-content: center;
    padding: 20px;
}

.contact form{
    width: 100%;
    max-width: 350px;
    display: flex;
    flex-direction: column;
}

.contact input[type="text"],
.contact textarea{
    margin-bottom: 15px;
    padding: 12px;
    border: none;
    border-radius: 8px;
    width: 100%;
    outline: none;
}

.select{
    margin-top: 10px;
    color: white;
    font-size: 18px;
}

.select div{
    margin-top: 12px;
}

.contact button{
    padding: 12px;
    background: rgb(172, 39, 233);
    border: none;
    color: white;
    cursor: pointer;
    border-radius: 35px;
    margin-top: 25px;
    font-size: 17px;
    transition: 0.3s;
}

.contact button:hover{
    background: rgb(31, 208, 221);
}

/* Mobile Responsive */
@media(max-width: 768px){

    .box{
        width: 90%;
        height: 470px;
    }

    .heading{
        top: 50px;
    }

    .heading h1{
        font-size: 30px;
    }

    .contact{
        top: 120px;
        padding: 15px;
    }

    .select{
        font-size: 16px;
    }

    .contact button{
        font-size: 15px;
    }
}

</style>
</head>

<body>

<div class="image">

    <img src="./eb2.jpg" alt="">

    <div class="box"></div>

    <div class="heading">
        <h1>EB BILL</h1>
    </div>

    <div class="contact">
        <form onsubmit="return submitForm(event)">

            <input type="text" placeholder="Current month reading" required>

            <input type="text" placeholder="Previous month reading" required>

            <div class="select">

                <div>
                    <input type="radio" name="radioDefault">
                    <label>Shop</label>
                </div>

                <div>
                    <input type="radio" name="radioDefault">
                    <label>Commercial</label>
                </div>

                <div>
                    <input type="radio" name="radioDefault">
                    <label>House</label>
                </div>

            </div>

            <button type="submit">
                Calculate Amount
            </button>

        </form>
    </div>

</div>

<script>

function submitForm(event){
    event.preventDefault();

    // get input values
    let inputs = document.querySelectorAll(".contact input[type='text']");
    let currentReading = parseFloat(inputs[0].value);
    let previousReading = parseFloat(inputs[1].value);

    // calculate units
    let units = currentReading - previousReading;

    if(units < 0){
        alert("Current reading must be greater than previous reading");
        return false;
    }

    // get selected radio
    let radios = document.querySelectorAll("input[name='radioDefault']");
    let type = "";

    if(radios[0].checked){
        type = "Shop";
    }
    else if(radios[1].checked){
        type = "Commercial";
    }
    else if(radios[2].checked){
        type = "House";
    }

    // rate calculation
    let rate = 0;

    if(type === "Shop"){
        rate = 8;
    }
    else if(type === "Commercial"){
        rate = 10;
    }
    else if(type === "House"){
        rate = 5;
    }

    let total = units * rate;

    alert(
        "Type: " + type +
        "\nUnits Used: " + units +
        "\nRate: ₹" + rate +
        "\nTotal EB Bill: ₹" + total
    );

    return false;
}

</script>

</body>
</html>
