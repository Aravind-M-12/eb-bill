<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aravind</title>
</head>
<style>
     *{
            margin: 0;
            padding: 0;
        }

    .image{
       display: flex;
       justify-content: center;
    }

    .contact form {
  max-width: 400px;
  margin: auto;
  display: flex;
  flex-direction: column;
}

.contact input, 
.contact textarea {
  margin-bottom: 10px;
  padding: 10px;
}

.contact button {
  padding: 10px;
  background: rgb(172, 39, 233);
  border: none;
  color: white;
  cursor: pointer;
}

.contact button:hover{
  background: rgb(31, 208, 221);
}

.radio1{
  margin-top: 138.4px;
  margin-left: 150px;
}

.radio2{
  margin-top: 138.4px;
  margin-left: 250px;
}

.select{
  margin-left: 50px;
  margin-top: 20px;
}
</style>

<body>
   
    <div style="position: relative;" class="image">
        <img src="./eb2.jpg" width="100%" height="635px" alt="">

        <div style="border: 1px;padding: 200px;position: absolute;top: 0;opacity: 0.3;border-radius: 15px;
        box-shadow: 2px 2px 10px white;margin-top: 70px;
        float: left;height: 100px;width: 100px;background: white;" >
        </div>

            <div style="position: absolute;top: 0;margin-top: 100px;display: flex;
            justify-content: center;" >
                <h1 style="color: white;">EB BILL</h1>
            </div>
    <div class="contact" style="position: absolute;top: 0;margin-right: 130px;margin-top: 200px;">
    <form onsubmit="return submitForm(event)">
    <input type="text" placeholder="Current month reading" required style="width: 150%;margin-right: 20px;">
    <input type="text" placeholder="previous month reading" required style="width: 150%;margin-top: 30px;">
    <div class="select">
    <input type="radio" name="radioDefault">
    <label for="radioDefault1">
      Shop
     </label>
      <div style="margin-top: 10px;">
    <input type="radio" name="radioDefault">
    <label for="radioDefault1">
      Commerical
     </label>
      <div style="margin-top: 10px;">
    <input type="radio" name="radioDefault">
    <label for="radioDefault1">
      House
     </label>
    </div>
    </div>
    </div>
    <button type="submit" style="width: 60%;border-radius: 35px;margin-top: 30px;margin-left: 95px;">
      Calculate Amount</button>
    </form>
    </div>
    </div>
</body>


<script>
function submitForm(event){
    event.preventDefault();

    // get input values
    let inputs = document.querySelectorAll(".contact input[type='text']");
    let currentReading = parseFloat(inputs[0].value);
    let previousReading = parseFloat(inputs[1].value);

    // calculate units
    let units = currentReading - previousReading;

    if(units < 0){
        alert("Current reading must be greater than previous reading");
        return false;
    }

    // get selected radio
    let radios = document.querySelectorAll("input[name='radioDefault']");
    let type = "";

    if(radios[0].checked){
        type = "Shop";
    }
    else if(radios[1].checked){
        type = "Commercial";
    }
    else if(radios[2].checked){
        type = "House";
    }

    // rate calculation
    let rate = 0;

    if(type === "Shop"){
        rate = 8;
    }
    else if(type === "Commercial"){
        rate = 10;
    }
    else if(type === "House"){
        rate = 5;
    }

    let total = units * rate;

    alert(
        "Type: " + type +
        "\nUnits Used: " + units +
        "\nRate: ₹" + rate +
        "\nTotal EB Bill: ₹" + total
    );

    return false;
}
</script>
</html>
