<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aravind</title>

<style>

*{
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body{
    font-family: Arial, Helvetica, sans-serif;
}

.image{
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
    min-height: 100vh;
    overflow: auto;
}

.image img{
    width: 100%;
    height: 100vh;
    object-fit: cover;
    position: fixed;
    top: 0;
    left: 0;
    z-index: -1;
}

/* BOX */

.box{
    position: absolute;
    width: 450px;
    max-width: 90%;
    min-height: 520px;
    background: rgba(255,255,255,0.2);
    border-radius: 15px;
    backdrop-filter: blur(3px);
    box-shadow: 0px 0px 10px white;
}

/* HEADING */

.heading{
    position: absolute;
    top: 80px;
    color: white;
    text-align: center;
}

.heading h1{
    font-size: 40px;
}

/* FORM */

.contact{
    position: absolute;
    top: 160px;
    width: 100%;
    display: flex;
    justify-content: center;
    padding: 20px;
}

.contact form{
    width: 100%;
    max-width: 350px;
    display: flex;
    flex-direction: column;
}

.contact input[type="text"]{
    margin-bottom: 15px;
    padding: 12px;
    border: none;
    border-radius: 8px;
    width: 100%;
    outline: none;
    font-size: 16px;
}

.select{
    margin-top: 10px;
    color: white;
    font-size: 18px;
}

.select div{
    margin-top: 12px;
}

.contact button{
    padding: 12px;
    background: rgb(172, 39, 233);
    border: none;
    color: white;
    cursor: pointer;
    border-radius: 35px;
    margin-top: 25px;
    font-size: 17px;
    transition: 0.3s;
}

.contact button:hover{
    background: rgb(31, 208, 221);
}

/* RESULT */

.result{
    margin-top: 25px;
    background: rgba(255,255,255,0.9);
    padding: 20px;
    border-radius: 10px;
    display: none;
    width: 100%;
    overflow-wrap: break-word;
}

.result h2{
    margin-bottom: 15px;
    color: rgb(172, 39, 233);
    text-align: center;
    font-size: 22px;
}

.result p{
    margin-top: 10px;
    font-size: 18px;
    color: black;
    line-height: 28px;
}

/* MOBILE */

@media(max-width:768px){

    .box{
        width: 90%;
        min-height: 560px;
    }

    .heading{
        top: 50px;
    }

    .heading h1{
        font-size: 30px;
    }

    .contact{
        top: 120px;
        padding: 15px;
    }

    .select{
        font-size: 16px;
    }

    .contact button{
        font-size: 15px;
    }

    .result p{
        font-size: 16px;
    }

}

</style>
</head>

<body>

<div class="image">

    <img src="./eb2.jpg" alt="">

    <!-- BOX -->

    <div class="box"></div>

    <!-- HEADING -->

    <div class="heading">
        <h1>EB BILL</h1>
    </div>

    <!-- FORM -->

    <div class="contact">

        <form onsubmit="return submitForm(event)">

            <input type="text" placeholder="Current month reading" required>

            <input type="text" placeholder="Previous month reading" required>

            <div class="select">

                <div>
                    <input type="radio" name="radioDefault">
                    <label>Shop</label>
                </div>

                <div>
                    <input type="radio" name="radioDefault">
                    <label>Commercial</label>
                </div>

                <div>
                    <input type="radio" name="radioDefault">
                    <label>House</label>
                </div>

            </div>

            <button type="submit">
                Calculate Amount
            </button>

            <!-- RESULT -->

            <div class="result" id="resultBox">

                <h2>EB BILL DETAILS</h2>

                <p id="type"></p>
                <p id="units"></p>
                <p id="rate"></p>
                <p id="total"></p>

            </div>

        </form>

    </div>

</div>

<script>

function submitForm(event){

    event.preventDefault();

    // INPUT VALUES

    let inputs = document.querySelectorAll(".contact input[type='text']");

    let currentReading = parseFloat(inputs[0].value);

    let previousReading = parseFloat(inputs[1].value);

    // CALCULATE UNITS

    let units = currentReading - previousReading;

    // VALIDATION

    if(units < 0){

        document.getElementById("resultBox").style.display = "block";

        document.getElementById("type").innerHTML = "";

        document.getElementById("units").innerHTML = "";

        document.getElementById("rate").innerHTML = "";

        document.getElementById("total").innerHTML =
        "Current reading must be greater than previous reading";

        return false;
    }

    // RADIO BUTTON

    let radios = document.querySelectorAll("input[name='radioDefault']");

    let type = "";

    if(radios[0].checked){

        type = "Shop";
    }

    else if(radios[1].checked){

        type = "Commercial";
    }

    else if(radios[2].checked){

        type = "House";
    }

    // RATE

    let rate = 0;

    if(type === "Shop"){

        rate = 8;
    }

    else if(type === "Commercial"){

        rate = 10;
    }

    else if(type === "House"){

        rate = 5;
    }

    // TOTAL

    let total = units * rate;

    // SHOW RESULT

    document.getElementById("resultBox").style.display = "block";

    document.getElementById("type").innerHTML =
    "Type : " + type;

    document.getElementById("units").innerHTML =
    "Units Used : " + units;

    document.getElementById("rate").innerHTML =
    "Rate : ₹" + rate;

    document.getElementById("total").innerHTML =
    "Total EB Bill : ₹" + total;

    return false;
}

</script>

</body>
</html>
